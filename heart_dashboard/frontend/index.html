<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Cat — Heart Disease Analytics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        --bg: #0d0f14;
        --bg2: #13161e;
        --bg3: #1a1e28;
        --card: #1e2230;
        --card2: #242838;
        --border: rgba(255, 255, 255, 0.07);
        --border2: rgba(255, 255, 255, 0.13);
        --text: #e8eaf0;
        --text2: #8b90a0;
        --text3: #555d70;
        --red: #e55;
        --red-soft: rgba(229, 85, 85, 0.12);
        --blue: #4a9eff;
        --blue-soft: rgba(74, 158, 255, 0.12);
        --green: #3ecf8e;
        --green-soft: rgba(62, 207, 142, 0.1);
        --amber: #f5a623;
        --amber-soft: rgba(245, 166, 35, 0.1);
        --teal: #2dd4bf;
        --accent: #e55;
        --radius: 14px;
        --radius-sm: 8px;
        --font: "DM Sans", sans-serif;
        --font-serif: "DM Serif Display", serif;
      }

      /* Light theme overrides — applied when `body` has the class `light-theme` */
      body.light-theme {
        --bg: #f7f8fb;
        --bg2: #ffffff;
        --bg3: #f2f4f8;
        --card: #ffffff;
        --card2: #fbfdff;
        --border: rgba(15, 23, 42, 0.06);
        --border2: rgba(15, 23, 42, 0.04);
        --text: #0f1724;
        --text2: #4b5563;
        --text3: #6b7280;
        --red-soft: rgba(229, 85, 85, 0.08);
        --blue-soft: rgba(74, 158, 255, 0.08);
      }

      /* Theme toggle button in sidebar */
      .theme-toggle {
        margin: 18px 24px 0 24px;
        padding: 8px 12px;
        border-radius: 999px;
        background: transparent;
        color: var(--text2);
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        border: 1px solid transparent;
        transition: all 0.15s ease;
      }
      .theme-toggle:hover {
        background: var(--bg3);
        border-color: var(--border2);
        color: var(--text);
      }

      /* Sidebar footer image */
      .sidebar-footer {
        margin-top: auto;
        padding: 18px 24px;
        text-align: center;
      }
      .sidebar-footer img {
        width: 220px;
        max-width: 100%;
        height: auto;
        border-radius: 0;
        box-shadow: none;
        display: block;
        margin: 0 auto;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      /* ─── LAYOUT ─── */
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 220px;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 0;
        z-index: 100;
      }
      .logo {
        padding: 0 24px 28px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .logo-title {
        font-family: var(--font-serif);
        font-size: 20px;
        color: var(--text);
        letter-spacing: -0.3px;
      }

      .logo-sub {
        font-size: 11px;
        color: var(--text3);
        margin-top: 2px;
        letter-spacing: 0.04em;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 24px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text2);
        cursor: pointer;
        border-left: 2px solid transparent;
        transition: all 0.18s;
        margin: 1px 0;
      }
      .nav-item:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
      }
      .nav-item.active {
        color: var(--text);
        border-left-color: var(--red);
        background: rgba(229, 85, 85, 0.06);
      }
      .nav-icon {
        font-size: 16px;
        width: 18px;
        text-align: center;
      }

      .main {
        margin-left: 220px;
        padding: 36px 40px;
        min-height: 100vh;
      }

      /* ─── SECTIONS ─── */
      .section {
        display: none;
        animation: fadeIn 0.25s ease;
      }
      .section.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-header {
        margin-bottom: 32px;
      }
      .page-title {
        font-family: var(--font-serif);
        font-size: 32px;
        font-weight: 400;
        color: var(--text);
        margin-bottom: 6px;
      }
      .page-sub {
        font-size: 14px;
        color: var(--text2);
      }

      /* ─── UPLOAD ─── */
      .upload-zone {
        border: 1.5px dashed var(--border2);
        border-radius: var(--radius);
        padding: 60px 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: var(--bg2);
        position: relative;
      }
      .upload-zone:hover,
      .upload-zone.drag {
        border-color: var(--red);
        background: rgba(229, 85, 85, 0.04);
      }
      .upload-zone input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }
      .upload-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .upload-title {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .upload-hint {
        font-size: 13px;
        color: var(--text2);
      }
      .upload-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 28px;
        border-radius: 40px;
        background: var(--red);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: opacity 0.15s;
      }
      .upload-btn:hover {
        opacity: 0.85;
      }

      .upload-status {
        margin-top: 20px;
        padding: 14px 20px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        display: none;
      }
      .upload-status.success {
        background: var(--green-soft);
        color: var(--green);
        border: 1px solid rgba(62, 207, 142, 0.2);
      }
      .upload-status.error {
        background: var(--red-soft);
        color: var(--red);
        border: 1px solid rgba(229, 85, 85, 0.2);
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 40px;
      }
      .info-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
      }
      .info-card h4 {
        font-size: 13px;
        color: var(--text2);
        margin-bottom: 12px;
        font-weight: 500;
      }
      .col-tag {
        display: inline-block;
        padding: 3px 10px;
        background: var(--bg3);
        border-radius: 4px;
        font-size: 11px;
        color: var(--text2);
        margin: 2px;
        font-family: monospace;
      }
      .col-tag.target {
        color: var(--red);
        background: var(--red-soft);
      }

      /* ─── METRICS ─── */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 28px;
      }
      .metric-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 22px;
      }
      .metric-label {
        font-size: 11px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }
      .metric-val {
        font-size: 30px;
        font-weight: 600;
        color: var(--text);
        line-height: 1;
      }
      .metric-sub {
        font-size: 12px;
        color: var(--text2);
        margin-top: 6px;
      }
      .metric-bar {
        height: 3px;
        background: var(--bg3);
        border-radius: 2px;
        margin-top: 14px;
      }
      .metric-fill {
        height: 100%;
        border-radius: 2px;
      }

      .charts-row {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .charts-row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 20px;
      }

      .chart-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
      }
      .chart-card-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 12px;
      }
      .leg {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--text2);
      }
      .leg-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      /* ─── STATS TABLE ─── */
      .risk-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .risk-table th {
        font-size: 11px;
        font-weight: 600;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        text-align: left;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .risk-table td {
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        vertical-align: middle;
      }
      .risk-table tr:last-child td {
        border: none;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge-h {
        background: var(--red-soft);
        color: var(--red);
      }
      .badge-m {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .badge-l {
        background: var(--green-soft);
        color: var(--green);
      }

      /* ─── PREDICT ─── */
      .predict-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .predict-form {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
      }
      .predict-result {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
      }

      .form-section-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin: 20px 0 14px;
      }
      .form-section-title:first-child {
        margin-top: 0;
      }

      .fields-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 12px;
        color: var(--text2);
        font-weight: 500;
      }
      .field input,
      .field select {
        background: var(--bg3);
        border: 1px solid var(--border2);
        border-radius: var(--radius-sm);
        color: var(--text);
        padding: 9px 13px;
        font-size: 13px;
        font-family: var(--font);
        outline: none;
        transition: border-color 0.15s;
        -webkit-appearance: none;
        appearance: none;
      }
      .field input:focus,
      .field select:focus {
        border-color: var(--red);
      }
      .field select option {
        background: #1a1e28;
      }

      .predict-btn {
        width: 100%;
        margin-top: 22px;
        padding: 13px;
        background: var(--red);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
        font-family: var(--font);
        letter-spacing: 0.02em;
      }
      .predict-btn:hover {
        opacity: 0.85;
      }
      .predict-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Result panel */
      .result-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 300px;
        color: var(--text3);
        text-align: center;
        gap: 12px;
      }
      .result-placeholder-icon {
        font-size: 48px;
        opacity: 0.4;
      }

      .result-panel {
        display: none;
      }
      .result-panel.show {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      .risk-gauge {
        text-align: center;
        padding: 30px 0 24px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 22px;
      }
      .risk-number {
        font-family: var(--font-serif);
        font-size: 64px;
        font-weight: 400;
        line-height: 1;
      }
      .risk-label-big {
        font-size: 16px;
        font-weight: 600;
        margin-top: 8px;
      }
      .risk-desc {
        font-size: 12px;
        color: var(--text2);
        margin-top: 6px;
      }

      .risk-bar-wrap {
        background: var(--bg3);
        border-radius: 6px;
        height: 8px;
        margin: 16px 0;
        overflow: hidden;
      }
      .risk-bar-fill {
        height: 100%;
        border-radius: 6px;
        transition: width 0.6s ease;
      }

      .feat-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .feat-bar-bg {
        flex: 1;
        margin: 0 12px;
        height: 4px;
        background: var(--bg3);
        border-radius: 3px;
      }
      .feat-bar {
        height: 100%;
        background: var(--blue);
        border-radius: 3px;
      }
      .feat-pct {
        color: var(--text2);
        min-width: 38px;
        text-align: right;
      }

      /* ─── LOADING ─── */
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: inline-block;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── NO DATA ─── */
      .no-data {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px;
        color: var(--text3);
        text-align: center;
        gap: 14px;
      }
      .no-data-icon {
        font-size: 52px;
        opacity: 0.3;
      }
      .no-data p {
        font-size: 14px;
        max-width: 320px;
        line-height: 1.6;
      }
      .no-data-btn {
        padding: 10px 24px;
        border-radius: 40px;
        background: transparent;
        border: 1px solid var(--border2);
        color: var(--text2);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: var(--font);
      }
      .no-data-btn:hover {
        border-color: var(--red);
        color: var(--red);
      }

      /* ─── ACCURACY BADGE ─── */
      .acc-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 14px;
        border-radius: 20px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
        font-weight: 600;
        border: 1px solid rgba(62, 207, 142, 0.2);
      }

      /* Access gate */
      .nav-item.locked {
        opacity: 0.35;
        cursor: not-allowed;
      }
      @keyframes homePulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      /* scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 3px;
      }
      /* article cards */
      .art-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .art-card.rec {
        border-color: rgba(74, 158, 255, 0.3);
        position: relative;
      }
      .art-title {
        font-size: 14px;
        color: var(--text);
        line-height: 1.55;
        font-weight: 500;
      }
      .art-summary {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.65;
        flex: 1;
      }
      .art-footer {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
      }
      .art-journal {
        background: var(--bg3);
        color: var(--text2);
        padding: 3px 10px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 11px;
      }
      .art-year {
        color: var(--text3);
        font-size: 12px;
      }
      .art-tag {
        background: var(--bg3);
        color: var(--text3);
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 99px;
      }
      .art-link {
        margin-left: auto;
        color: var(--red);
        font-size: 18px;
        text-decoration: none;
      }
      .art-rec-badge {
        position: absolute;
        top: 14px;
        right: 14px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 9px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside id="sidebar-root" class="sidebar">
      <!-- sidebar partial will be loaded here -->
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div id="section-root"><!-- section partials mount here --></div>
    </main>

    <script>
      // Loader (synchronous XHR) — loads HTML partials into mount points before the main script runs
      (function () {
        function loadSync(url) {
          try {
            var req = new XMLHttpRequest();
            req.open("GET", url, false); // synchronous
            req.send(null);
            if (req.status === 200 || req.status === 0) return req.responseText;
          } catch (e) {}
          return "";
        }
        try {
          var sidebar = loadSync("partials/sidebar.html");
          if (sidebar)
            document.getElementById("sidebar-root").innerHTML = sidebar;

          // Load each partial into its own temp element to avoid cross-partial HTML parsing issues
          // (e.g. a <script> tag in one partial corrupting the next partial's DOM)
          var root = document.getElementById("section-root");
          [
            "home",
            "upload",
            "dashboard",
            "predict",
            "articles",
            "doctors",
          ].forEach(function (name) {
            var html = loadSync("partials/" + name + ".html");
            if (!html) return;
            var tmp = document.createElement("div");
            tmp.innerHTML = html;
            while (tmp.firstChild) root.appendChild(tmp.firstChild);
          });

          // Fix data-src -> src for injected images (partials use data-src)
          var basePath =
            window.location.pathname.indexOf("/heart_dashboard/frontend/") !==
            -1
              ? ""
              : "heart_dashboard/frontend/";
          document
            .querySelectorAll("#sidebar-root img[data-src]")
            .forEach(function (img) {
              try {
                var ds = img.getAttribute("data-src");
                var primary = basePath + ds;
                var alt =
                  basePath === "" ? "heart_dashboard/frontend/" + ds : ds;
                img.src = primary;
                img.onerror = function () {
                  img.onerror = null;
                  img.src = alt;
                };
              } catch (e) {}
            });
        } catch (e) {
          console.error("Partial load failed", e);
        }
      })();
    </script>

    <script>
      /* Theme handling: apply saved preference (localStorage) and wire toggle */
      function setTheme(isLight) {
        if (isLight) {
          document.body.classList.add("light-theme");
          document.getElementById("themeToggle").textContent = "☀ Light";
          document.getElementById("themeToggle").title = "Switch to dark mode";
        } else {
          document.body.classList.remove("light-theme");
          document.getElementById("themeToggle").textContent = "🌙 Night";
          document.getElementById("themeToggle").title = "Switch to light mode";
        }
      }

      function toggleTheme() {
        const isLight = !document.body.classList.contains("light-theme");
        setTheme(isLight);
        try {
          localStorage.setItem("cardiosense_theme_light", isLight ? "1" : "0");
        } catch (e) {}
      }

      // Initialize theme from localStorage
      try {
        const saved = localStorage.getItem("cardiosense_theme_light");
        setTheme(saved === "1");
      } catch (e) {}

      /* gate is session-only - no auto-restore */

      /* ===================================================================
   BACKEND URL CONFIGURATION
   -------------------------------------------------------------------
   When you open this page from your own computer (localhost / 127.0.0.1)
   it talks to the Flask server on port 5001, as before.

   When the page is served from anywhere else (your deployed Render
   static site), it uses BACKEND_URL below instead.

   >>> AFTER you deploy the backend on Render, paste its URL here. <<<
   e.g.  const BACKEND_URL = 'https://heart-disease-backend.onrender.com';
   (no trailing slash, no /api at the end)
   =================================================================== */

        if (!el) return;

          navGated(el);
          return;
        }
        document
          .querySelectorAll(".nav-item")
          .forEach((n) => n.classList.remove("active"));
        el.classList.add("active");
        const sec = el.dataset.section;
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        const secEl = document.getElementById("sec-" + sec);
        if (secEl) secEl.classList.add("active");
        if (sec === "dashboard" && statsData) renderDashboard(statsData);
        if (sec === "doctors" && _doctorsMap)
          setTimeout(function () {
            _doctorsMap.invalidateSize();
          }, 50);
      }

      // ─── ACCESS GATE ───
      var accessGranted = false;
      var dataUploaded = false;

      function unlockDataSections() {
        ["dashboard", "predict"].forEach(function (sec) {
          var el = document.querySelector(
            '.nav-item[data-section="' + sec + '"]',
          );
          if (el && el.classList.contains("locked")) {
            el.classList.remove("locked");
            var lk = el.querySelector(".lock-icon");
            if (lk) lk.remove();
            el.onclick = function () {
              nav(el);
            };
            el.removeAttribute("title");
          }
        });
      }

      function grantAccess() {
        accessGranted = true;
        // Upload and Articles unlock on consent; Dashboard/Predict need a dataset uploaded first
        ["upload", "articles", "doctors"].forEach(function (sec) {
          var el = document.querySelector(
            '.nav-item[data-section="' + sec + '"]',
          );
          if (!el) return;
          el.classList.remove("locked");
          var lk = el.querySelector(".lock-icon");
          if (lk) lk.remove();
          el.onclick = function () {
            nav(el);
          };
          el.removeAttribute("title");
        });
        ["dashboard", "predict"].forEach(function (sec) {
          var el = document.querySelector(
            '.nav-item[data-section="' + sec + '"]',
          );
          if (el) el.setAttribute("title", "Upload a dataset first to unlock");
        });
        var btn = document.getElementById("consentBtn");
        if (btn) {
          btn.textContent = "✓ Access granted — upload a dataset to continue";
          btn.style.background = "var(--green)";
          btn.disabled = true;
          btn.style.cursor = "default";
        }
      }

      function navGated(el) {
        if (!accessGranted) {
          var card = document.getElementById("consentCard");
          if (card) {
            card.style.boxShadow = "0 0 0 2px var(--red)";
            setTimeout(function () {
              card.style.boxShadow = "";
            }, 1200);
            card.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          document.querySelectorAll(".section").forEach(function (s) {
            s.classList.remove("active");
          });
          var home = document.getElementById("sec-home");
          if (home) home.classList.add("active");
          document.querySelectorAll(".nav-item").forEach(function (n) {
            n.classList.remove("active");
          });
          var homeNav = document.querySelector('[data-section="home"]');
          if (homeNav) homeNav.classList.add("active");
          return;
        }
        // Consented but no dataset yet — send to Upload page
        var uploadNav = document.querySelector(
          '.nav-item[data-section="upload"]',
        );
        if (uploadNav) nav(uploadNav);
      }

      // ─── UPLOAD ───
      const dropZone = document.getElementById("dropZone");
      if (dropZone) {
        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropZone.classList.add("drag");
        });
        dropZone.addEventListener("dragleave", () =>
          dropZone.classList.remove("drag"),
        );
        dropZone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropZone.classList.remove("drag");
          if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });
      }

      function showStatus(msg, type) {
        const el = document.getElementById("uploadStatus");
        el.textContent = msg;
        el.className = "upload-status " + type;
        el.style.display = "block";
      }

      async function handleFile(file) {
        if (!file) return;
        showStatus("⏳ Uploading and training model...", "success");
        const fd = new FormData();
        fd.append("file", file);
        try {
          const res = await fetch(API + "/upload", {
            method: "POST",
            body: fd,
          });
          const data = await res.json();
          if (data.error) {
            showStatus("✗ " + data.error, "error");
            return;
          }
          statsData = data.stats;
          dataUploaded = true;
          showStatus(
            `✓ Dataset loaded — ${data.stats.total} patients · Model accuracy: ${data.stats.model_accuracy}%`,
            "success",
          );
          enableSections();
        } catch (e) {
          showStatus(
            "✗ Could not connect to backend. Make sure the Flask server is running on port 5001.",
            "error",
          );
        }
      }

        if (!accessGranted || !dataUploaded) return;

        document.getElementById("predict-no-data").style.display = "none";
        document.getElementById("predict-content").style.display = "block";

      }

        return `<div class="metric-card">

  </div>`;
      }

      function badge(level) {
        const cls = level === "High" ? "h" : level === "Medium" ? "m" : "l";
        return `<span class="badge badge-${cls}">${level}</span>`;
      }

      function makeChart(id, type, data, opts = {}) {
        if (charts[id]) {
          charts[id].destroy();
        }
        const defaults = { responsive: true, maintainAspectRatio: false };
        charts[id] = new Chart(document.getElementById(id), {
          type,
          data,
          options: {
            ...defaults,
            ...opts,
            plugins: { legend: { display: false }, ...opts.plugins },
          },
        });
      }

      // ─── PREDICT ───
      const FIELDS = [
        "age",
        "sex",
        "cp",
        "trestbps",
        "chol",
        "fbs",
        "restecg",
        "thalach",
        "exang",
        "oldpeak",
        "slope",
        "ca",
        "thal",
      ];

      async function runPredict() {
        const btn = document.getElementById("predictBtn");
        const payload = {};

        // Define valid ranges for numeric fields
        const fieldRanges = {
          age: { min: 18, max: 120 },
          trestbps: { min: 70, max: 250 },
          chol: { min: 100, max: 600 },
          thalach: { min: 40, max: 250 },
          oldpeak: { min: 0, max: 6.2 },
        };

        let hasError = false;
        for (const f of FIELDS) {
          const el = document.getElementById("f-" + f);
          if (!el || el.value === "") {
            if (el) _fieldError(el, "Required");
            hasError = true;
            continue;
          }
          const value = parseFloat(el.value);
          if (fieldRanges[f]) {
            const range = fieldRanges[f];
            if (value < range.min || value > range.max) {
              _fieldError(
                el,
                value < range.min ? "Min: " + range.min : "Max: " + range.max,
              );
              hasError = true;
              continue;
            }
          }
          _fieldOk(el);
          payload[f] = value;
        }
        if (hasError) return;

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Analysing...';
        try {
          const res = await fetch(API + "/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (data.error) {
            alert("Error: " + data.error);
            return;
          }
          showResult(data);
          try {
            generateAiReport(data, payload);
          } catch (e) {
            /* ignore if AI unavailable */
          }
        } catch (e) {
          alert(
            "Could not connect to backend. Ensure Flask is running on port 5001.",
          );
        }
        btn.disabled = false;
        btn.innerHTML = "Analyse Patient Risk";
      }

      function showResult(data) {
        document.getElementById("resultPlaceholder").style.display = "none";
        const panel = document.getElementById("resultPanel");
        panel.style.display = "block";
        panel.classList.add("show");

        const isDisease = data.prediction === 1;
        const color =
          data.risk_level === "High"
            ? "#e55"
            : data.risk_level === "Medium"
              ? "#f5a623"
              : "#3ecf8e";

        document.getElementById("riskGauge").innerHTML = `
    <div class="risk-number" style="color:${color}">${data.risk_pct}%</div>
    <div class="risk-label-big" style="color:${color}">${data.risk_level} Risk — ${isDisease ? "Heart Disease Likely" : "No Disease Detected"}</div>
    <div class="risk-desc">The model predicts ${isDisease ? "presence" : "absence"} of heart disease with ${data.risk_pct}% confidence.</div>
    <div class="risk-bar-wrap">
      <div class="risk-bar-fill" style="width:${data.risk_pct}%;background:${color}"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:4px">
      <span>No Disease ${data.no_disease_pct}%</span>
      <span>Disease ${data.risk_pct}%</span>
    </div>
  `;

        const maxImp = Math.max(...data.top_features.map((f) => f.importance));
        document.getElementById("featImportance").innerHTML = data.top_features
          .map(
            (f) => `
    <div class="feat-item">
      <span style="min-width:80px;color:var(--text2)">${f.name}</span>
      <div class="feat-bar-bg"><div class="feat-bar" style="width:${((f.importance / maxImp) * 100).toFixed(0)}%"></div></div>
      <span class="feat-pct">${f.importance}%</span>
    </div>
  `,
          )
          .join("");

        // Feed prediction to articles recommender
        if (typeof window.setArticlePrediction === "function") {
          window.setArticlePrediction(data);
        }
      }

      let lastAiReport = "";

      async function generateAiReport(data, patientFields) {
        const card = document.getElementById("aiReportCard");
        const loading = document.getElementById("aiLoading");
        const preview = document.getElementById("aiPreview");
        const previewText = document.getElementById("aiPreviewText");
        const buttonsContainer = document.getElementById("aiButtonsContainer");
        const chip = document.getElementById("aiRiskChip");

        if (!card) return;
        card.style.display = "block";
        loading.style.display = "flex";
        preview.style.display = "none";
        buttonsContainer.style.display = "none";

        const chipColor =
          data.risk_level === "High"
            ? "var(--red)"
            : data.risk_level === "Medium"
              ? "var(--amber)"
              : "var(--green)";
        const chipBg =
          data.risk_level === "High"
            ? "var(--red-soft)"
            : data.risk_level === "Medium"
              ? "var(--amber-soft)"
              : "var(--green-soft)";
        chip.style.color = chipColor;
        chip.style.background = chipBg;
        chip.textContent = `● ${data.risk_level} Risk`;

        const featNames = {
          age: "Age",
          sex: "Sex",
          cp: "Chest pain type",
          trestbps: "Resting BP",
          chol: "Cholesterol",
          fbs: "Fasting blood sugar",
          restecg: "Resting ECG",
          thalach: "Max heart rate",
          exang: "Exercise angina",
          oldpeak: "ST depression",
          slope: "ST slope",
          ca: "Major vessels",
          thal: "Thalassemia",
        };

        const topFeatures = (data.top_features || [])
          .map(
            (f) => `${featNames[f.name] || f.name} (${f.importance}% weight)`,
          )
          .join(", ");
        const patientSummary = Object.entries(patientFields)
          .map(([k, v]) => `${featNames[k] || k}: ${v}`)
          .join(", ");

        const prompt = `You are a clinical decision support AI assisting cardiologists. A machine learning model has assessed a patient for heart disease risk.\n\nPatient data: ${patientSummary}\n\nModel result: ${data.risk_level} risk — ${data.risk_pct}% probability of heart disease.\nTop contributing features: ${topFeatures}\n\nWrite a concise clinical report with three short sections:\n1. Clinical Overview: (2-3 sentences summarising the patient profile and prediction)\n2. Key Risk Drivers: (bullet points explaining what each top feature means clinically)\n3. Recommended Actions: (3-4 specific clinical next steps)\n\nBe precise and medically appropriate. Do not use markdown headers — use plain text with the section names followed by a colon.`;

        try {
          const res = await fetch(API + "/ai-report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });
          const j = await res.json();
          const text = j.text || j.error || "Report unavailable.";
          lastAiReport = text;
          loading.style.display = "none";

          // Show preview (truncated)
          const previewLength = 250;
          const displayText =
            text.length > previewLength
              ? text.substring(0, previewLength) + "..."
              : text;
          previewText.textContent = displayText;
          preview.style.display = "block";
          buttonsContainer.style.display = "flex";
        } catch (e) {
          loading.style.display = "none";
          previewText.textContent =
            "Could not generate AI report. Ensure your Groq API key is configured on the server.";
          preview.style.display = "block";
        }
      }

      function openAiModal() {

        age: "Age",
        sex: "Sex",
        cp: "Chest pain type",
        trestbps: "Resting BP",
        chol: "Cholesterol",
        fbs: "Blood sugar",
        restecg: "ECG result",
        thalach: "Max heart rate",
        exang: "Exercise angina",
        oldpeak: "ST depression",

        ca: "Major vessels",
        thal: "Thalassemia",
      };

      var _articlePred = null;
      var _articlePredLast = null; // retains last prediction so reapply works after clear

      function _articleScore(a) {
        if (!_articlePred) return 0;
        var s = 0;
        (_articlePred.top_features || []).forEach(function (f, i) {
          if (a.tags.indexOf(f.name) !== -1) s += Math.max(4 - i, 1);
        });
        var rl = _articlePred.risk_level;
        if (rl === "High" && a.tags.indexOf("high_risk") !== -1) s += 4;
        if (
          (rl === "High" || rl === "Medium") &&
          a.tags.indexOf("heart_failure") !== -1
        )
          s += 3;
        if (a.tags.indexOf("prevention") !== -1)
          s += rl === "Low" ? 3 : rl === "Medium" ? 2 : 1;
        return s;
      }

      function _makeArticleCard(a, rec) {
        var hasUrl = a.url && a.url.trim() !== "";
        var tagChips = a.tags
          .slice(0, 3)
          .map(function (t) {
            return '<span class="art-tag">' + (FEAT_LABELS[t] || t) + "</span>";
          })
          .join("");
        return (
          '<div class="art-card' +
          (rec ? " rec" : "") +
          '">' +
          (rec ? '<div class="art-rec-badge">RECOMMENDED</div>' : "") +
          '<div class="art-title" style="padding-right:' +
          (rec ? "110px" : "0") +
          ';">' +
          a.title +
          "</div>" +
          '<div class="art-summary">' +
          a.summary +
          "</div>" +
          '<div class="art-footer">' +
          '<span class="art-journal">' +
          a.journal +
          "</span>" +
          '<span class="art-year">' +
          a.year +
          "</span>" +
          tagChips +
          (hasUrl
            ? '<a href="' +
              a.url +
              '" target="_blank" rel="noopener noreferrer" class="art-link">⤴</a>'
            : "") +
          "</div></div>"
        );
      }

      function renderArticles() {
        // Never touches mainArticleList — static cards in articles.html are permanent.
        // Only manages the recommendation banner/section that appears above them.
        function sd(id, val) {
          var e = document.getElementById(id);
          if (e) e.style.display = val;
        }
        function txt(id, val) {
          var e = document.getElementById(id);
          if (e) e.textContent = val;
        }

        if (!_articlePred) {
          sd("recSection", "none");
          sd("recBanner", "none");
          sd("reapplyBanner", _articlePredLast ? "flex" : "none");
          txt(
            "articlesSub",
            _articlePredLast
              ? "Recommendations cleared — click Reapply to restore them."
              : "45 peer-reviewed articles — run a prediction to get personalised recommendations.",
          );
          return;
        }

        var scored = ARTICLES.map(function (a) {
          return { a: a, s: _articleScore(a) };
        }).sort(function (x, y) {
          return y.s - x.s;
        });
        var rec = scored
          .filter(function (x) {
            return x.s > 0;
          })
          .slice(0, 4)
          .map(function (x) {
            return x.a;
          });

        var recEl = document.getElementById("recList");
        if (recEl)
          recEl.innerHTML = rec
            .map(function (a) {
              return _makeArticleCard(a, true);
            })
            .join("");
        sd("recSection", rec.length ? "block" : "none");
        sd("recBanner", "flex");
        sd("reapplyBanner", "none");

        var topLabels = (_articlePred.top_features || [])
          .slice(0, 2)
          .map(function (f) {
            return FEAT_LABELS[f.name] || f.name;
          })
          .join(", ");
        txt(
          "recBannerText",
          _articlePred.risk_level +
            " risk · Key drivers: " +
            topLabels +
            ". Articles ranked by clinical relevance.",
        );
        txt(
          "articlesSub",
          rec.length +
            " articles recommended based on " +
            _articlePred.risk_level +
            " risk (" +
            _articlePred.risk_pct +
            "% confidence). All 15 articles below.",
        );
      }

      window.setArticlePrediction = function (data) {
        _articlePred = data;
        _articlePredLast = data;
        renderArticles();
      };
      window.clearArticleRec = function () {
        _articlePred = null;
        renderArticles();
      };
      window.reapplyArticleRec = function () {
        _articlePred = _articlePredLast;
        renderArticles();
      };

      function _fieldError(el, msg) {
        el.style.borderColor = "var(--red)";
        var err = el.parentNode.querySelector(".field-err");
        if (!err) {
          err = document.createElement("div");
          err.className = "field-err";
          err.style.cssText =
            "font-size:10px;color:var(--red);margin-top:3px;display:flex;align-items:center;gap:4px;font-weight:500;";
          el.parentNode.appendChild(err);
        }
        err.textContent = "✕  " + msg;
        err.style.display = "flex";
      }
      function _fieldOk(el) {
        el.style.borderColor = "";
        var err = el.parentNode.querySelector(".field-err");
        if (err) err.style.display = "none";
      }
      window.validateInput = function (el) {
        if (el.value === "") {
          _fieldOk(el);
          return;
        }
        var v = parseFloat(el.value);
        if (isNaN(v)) {
          _fieldOk(el);
          return;
        }
        var mn = parseFloat(el.min),
          mx = parseFloat(el.max);
        if (!isNaN(mn) && v < mn) {
          _fieldError(el, "Min: " + mn);
          return;
        }
        if (!isNaN(mx) && v > mx) {
          _fieldError(el, "Max: " + mx);
          return;
        }
        _fieldOk(el);
      };

      var _doctorsMap = null;
      var _doctorsMarkers = [];
      var _doctorsAllPlaces = [];

      function requestDoctorsLocation() {
        if (!navigator.geolocation) {
          _doctorsSetError("Geolocation is not supported by your browser.");
          return;
        }
        var btn = document.getElementById("doctorsLocBtn");
        btn.innerHTML =
          '<span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff;"></span> Locating…';
        btn.disabled = true;
        document.getElementById("doctorsLocError").style.display = "none";

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            _doctorsInit(pos.coords.latitude, pos.coords.longitude);
          },
          function (err) {
            btn.disabled = false;
            btn.innerHTML = "📍 &nbsp;Allow Location";
            var msgs = {
              1: "Location access denied. Please allow it in your browser settings and try again.",
              2: "Location unavailable. Check your connection and try again.",
              3: "Request timed out. Please try again.",
            };
            _doctorsSetError(msgs[err.code] || "Location access failed.");
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 300000 },
        );
      }

      function _doctorsSetError(msg) {
        var el = document.getElementById("doctorsLocError");
        el.textContent = msg;
        el.style.display = "block";
      }

      function _doctorsInit(lat, lng) {
        document.getElementById("doctorsLocBox").style.display = "none";
        document.getElementById("doctorsMapPlaceholder").style.display = "none";
        document.getElementById("doctorsSub").textContent =
          "Searching for cardiologists, hospitals, and clinics within 15 km…";

        if (!_doctorsMap) {
          _doctorsMap = L.map("doctorsMap", { zoomControl: true }).setView(
            [lat, lng],
            13,
          );
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
            detectRetina: true,
          }).addTo(_doctorsMap);
        } else {
          _doctorsMap.setView([lat, lng], 13);
        }

        // Distinctive SVG pin for user location
        var _userPin = L.divIcon({
          className: "",
          html:
            '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="42" viewBox="0 0 30 42">' +
            '<path d="M15 0C6.7 0 0 6.7 0 15c0 11.2 15 27 15 27S30 26.2 30 15C30 6.7 23.3 0 15 0z" fill="#4a9eff" stroke="white" stroke-width="2.5"/>' +
            '<circle cx="15" cy="15" r="6" fill="white"/>' +
            "</svg>",
          iconSize: [30, 42],
          iconAnchor: [15, 42],
          popupAnchor: [0, -44],
        });
        L.marker([lat, lng], { icon: _userPin })
          .addTo(_doctorsMap)
          .bindPopup(
            '<b style="font-family:sans-serif;font-size:13px;">📍 Your location</b>',
          );

        _doctorsFetch(lat, lng);
      }

      async function _doctorsFetch(lat, lng) {
        var listEl = document.getElementById("doctorsList");
        listEl.innerHTML =
          '<div style="text-align:center;padding:48px 20px;color:var(--text3);font-size:13px;"><span class="spinner" style="border-color:var(--border2);border-top-color:var(--red);"></span><br><br>Searching nearby…</div>';

        var q =
          "[out:json][timeout:30];\n(\n" +
          '  node["healthcare:speciality"~"cardio",i](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  way["healthcare:speciality"~"cardio",i](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  node["speciality"~"cardio",i](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  way["speciality"~"cardio",i](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  node["specialty"~"cardio",i](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  way["specialty"~"cardio",i](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  node["name"~"cardio",i]["amenity"](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  way["name"~"cardio",i]["amenity"](around:15000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  node["amenity"="hospital"](around:10000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  way["amenity"="hospital"](around:10000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  node["amenity"="clinic"](around:8000,' +
          lat +
          "," +
          lng +
          ");\n" +
          '  way["amenity"="clinic"](around:8000,' +
          lat +
          "," +
          lng +
          ");\n" +
          ");\nout center tags;";

        try {
          var resp = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            body: "data=" + encodeURIComponent(q),
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          var json = await resp.json();
          if (json.remark && (!json.elements || !json.elements.length))
            throw new Error(json.remark);
          var raw = json.elements || [];

          var seen = {};
          var places = [];
          raw.forEach(function (el) {
            var elLat =
              el.lat != null ? el.lat : el.center ? el.center.lat : null;
            var elLng =
              el.lon != null ? el.lon : el.center ? el.center.lon : null;
            if (elLat == null || elLng == null) return;
            var tags = el.tags || {};
            var key = elLat.toFixed(4) + "," + elLng.toFixed(4);
            if (seen[key]) return;
            seen[key] = 1;

            var specialtyRaw = (
              tags["healthcare:speciality"] ||
              tags["speciality"] ||
              tags["specialty"] ||
              ""
            ).toLowerCase();
            var amenity = tags.amenity || "";
            var allNames =
              (tags.name || "") +
              " " +
              (tags["name:en"] || "") +
              " " +
              (tags["name:fr"] || "");
            var nameLower = allNames.toLowerCase();

            var cat;
            if (
              specialtyRaw.indexOf("cardio") !== -1 ||
              nameLower.indexOf("cardio") !== -1 ||
              nameLower.indexOf("cardiolog") !== -1 ||
              (tags.name || "").indexOf("قلب") !== -1
            ) {
              cat = "cardiologist";
            } else if (amenity === "hospital") {
              cat = "hospital";
            } else if (amenity === "clinic") {
              cat = "clinic";
            } else {
              cat = "cardiologist";
            }

            // Prefer English or French name over local-language name
            var defaultNames = {
              cardiologist: "Cardiologist",
              hospital: "Hospital",
              clinic: "Medical Clinic",
            };
            var displayName =
              tags["name:en"] ||
              tags["name:fr"] ||
              tags.name ||
              defaultNames[cat];
            places.push({
              name: displayName,
              lat: elLat,
              lng: elLng,
              tags: tags,
              cat: cat,
              dist: _haversine(lat, lng, elLat, elLng),
            });
          });

          places.sort(function (a, b) {
            return a.dist - b.dist;
          });
          places = places.slice(0, 40);
          _doctorsAllPlaces = places;

          document.getElementById("doctorsFilters").style.display = "flex";
          document.getElementById("doctorsCount").style.display = "block";
          document.getElementById("doctorsLegend").style.display = "flex";
          document.querySelectorAll(".doc-chip").forEach(function (c) {
            c.classList.toggle("active", c.dataset.cat === "all");
          });

          _doctorsRender(places, "all providers");
        } catch (e) {
          document.getElementById("doctorsSub").textContent =
            "Could not load map data. Check your connection.";
          listEl.innerHTML =
            '<div style="text-align:center;padding:36px 20px;color:var(--red);font-size:13px;line-height:1.7;">Failed to load nearby results.<br>Please try again later.</div>';
        }
      }

      function filterDoctors(cat) {
        document.querySelectorAll(".doc-chip").forEach(function (c) {
          c.classList.toggle("active", c.dataset.cat === cat);
        });
        var filtered =
          cat === "all"
            ? _doctorsAllPlaces
            : _doctorsAllPlaces.filter(function (p) {
                return p.cat === cat;
              });
        var label =
          {
            all: "all providers",
            cardiologist: "cardiologists",
            hospital: "hospitals",
            clinic: "clinics",
          }[cat] || cat;
        _doctorsRender(filtered, label);
      }

      function _doctorsRender(places, label) {
        var listEl = document.getElementById("doctorsList");
        var countEl = document.getElementById("doctorsCount");
        var sub = document.getElementById("doctorsSub");

        _doctorsMarkers.forEach(function (m) {
          _doctorsMap.removeLayer(m);
        });
        _doctorsMarkers = [];

        if (places.length === 0) {
          sub.textContent = "No results for this filter.";
          countEl.textContent = "0 results";
          listEl.innerHTML =
            '<div style="text-align:center;padding:48px 20px;color:var(--text3);font-size:13px;line-height:1.7;">Nothing found for this category.<br>Try a different filter.</div>';
          return;
        }

        sub.textContent = places.length + " " + label + " found within 15 km.";
        countEl.textContent =
          places.length + " result" + (places.length === 1 ? "" : "s");

        var markerColors = {
          cardiologist: "#e55",
          hospital: "#f5a623",
          clinic: "#4a9eff",
        };

        places.forEach(function (p, i) {
          var color = markerColors[p.cat] || "#e55";
          var m = L.circleMarker([p.lat, p.lng], {
            radius: 9,
            fillColor: color,
            color: "#fff",
            weight: 2,
            fillOpacity: 0.9,
          });
          m.bindPopup(
            '<div style="font-family:sans-serif;min-width:180px;line-height:1.65;">' +
              '<b style="font-size:13px;">' +
              _esc(p.name) +
              "</b><br>" +
              '<span style="color:#888;font-size:12px;">' +
              _catLabel(p.cat) +
              " · " +
              p.dist.toFixed(1) +
              " km</span>" +
              (p.tags.phone
                ? '<br>📞 <span style="font-size:12px;">' +
                  _esc(p.tags.phone) +
                  "</span>"
                : "") +
              (p.tags["opening_hours"]
                ? '<br>🕐 <span style="font-size:12px;">' +
                  _esc(p.tags["opening_hours"]) +
                  "</span>"
                : "") +
              "</div>",
          );
          m.on("click", function () {
            _doctorsHighlight(i);
          });
          m.addTo(_doctorsMap);
          _doctorsMarkers.push(m);
        });

        var group = L.featureGroup(_doctorsMarkers);
        _doctorsMap.fitBounds(group.getBounds().pad(0.15));

        listEl.innerHTML = places
          .map(function (p, i) {
            return _doctorCard(p, i);
          })
          .join("");
      }

      function _catLabel(cat) {
        return (
          {
            cardiologist: "❤️ Cardiologist",
            hospital: "🏥 Hospital",
            clinic: "🩺 Clinic",
          }[cat] || "⚕️ Healthcare"
        );
      }

      function _doctorCard(p, i) {
        var bgSoft =
          {
            cardiologist: "var(--red-soft)",
            hospital: "var(--amber-soft)",
            clinic: "var(--blue-soft)",
          }[p.cat] || "var(--red-soft)";
        var fgColor =
          {
            cardiologist: "var(--red)",
            hospital: "var(--amber)",
            clinic: "var(--blue)",
          }[p.cat] || "var(--red)";
        var icon =
          { cardiologist: "❤️", hospital: "🏥", clinic: "🩺" }[p.cat] || "⚕️";
        var specialty =
          p.tags["healthcare:speciality"] ||
          p.tags["speciality"] ||
          p.tags["specialty"] ||
          "";
        var addr = [
          p.tags["addr:housenumber"],
          p.tags["addr:street:en"] || p.tags["addr:street"],
        ]
          .filter(Boolean)
          .join(" ");
        var phone = p.tags.phone || p.tags["contact:phone"] || "";
        var hours = p.tags["opening_hours"] || "";
        var web = p.tags.website || p.tags["contact:website"] || "";

        return (
          '<div class="doc-card" id="dcard-' +
          i +
          '" onclick="focusDoctor(' +
          i +
          ')">' +
          '<div class="doc-icon" style="background:' +
          bgSoft +
          ';">' +
          icon +
          "</div>" +
          '<div style="min-width:0;flex:1;">' +
          '<div class="doc-name" title="' +
          _esc(p.name) +
          '">' +
          _esc(p.name) +
          "</div>" +
          '<div class="doc-type" style="color:' +
          fgColor +
          ';">' +
          _catLabel(p.cat) +
          "</div>" +
          '<div class="doc-meta">' +
          (specialty ? "🩺 " + _esc(specialty) + "<br>" : "") +
          (addr ? "📍 " + _esc(addr) + "<br>" : "") +
          (phone ? "📞 " + _esc(phone) + "<br>" : "") +
          (hours ? "🕐 " + _esc(hours) + "<br>" : "") +
          (web
            ? '<a href="' +
              _esc(web) +
              '" target="_blank" rel="noopener" style="color:var(--blue);font-size:11px;text-decoration:none;">🔗 Website</a>'
            : "") +
          "</div>" +
          "</div>" +
          '<div class="doc-dist">' +
          p.dist.toFixed(1) +
          " km</div>" +
          "</div>"
        );
      }

      function focusDoctor(i) {
        _doctorsHighlight(i);
        if (_doctorsMarkers[i]) {
          _doctorsMap.flyTo(_doctorsMarkers[i].getLatLng(), 16, {
            animate: true,
            duration: 0.7,
          });
          setTimeout(function () {
            if (_doctorsMarkers[i]) _doctorsMarkers[i].openPopup();
          }, 700);
        }
      }

      function _doctorsHighlight(i) {
        document.querySelectorAll(".doc-card").forEach(function (c, j) {
          c.classList.toggle("active", j === i);
        });
        var card = document.getElementById("dcard-" + i);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function _haversine(lat1, lng1, lat2, lng2) {
        var R = 6371,
          dL = ((lat2 - lat1) * Math.PI) / 180,
          dG = ((lng2 - lng1) * Math.PI) / 180;
        var a =
          Math.sin(dL / 2) * Math.sin(dL / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dG / 2) *
            Math.sin(dG / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function _esc(s) {
        var d = document.createElement("div");
        d.textContent = s || "";
        return d.innerHTML;
      }

      // Check backend on load
      (async () => {
        try {
          const r = await fetch(API + "/health");
          const d = await r.json();
          if (d.dataset_loaded) {
            const sr = await fetch(API + "/stats");
            statsData = await sr.json();
            enableSections();
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
